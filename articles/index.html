  <script>
    (() => {
      const key = "ges-theme-preference";
      let stored = null;
      try {
        stored = window.localStorage.getItem(key);
      } catch {}
      const selected = stored === "light" || stored === "dark" ? stored : "system";
      const system = window.matchMedia?.("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.gesTheme = selected;
      document.documentElement.dataset.gesThemeResolved = selected === "system" ? system : selected;
    })();
  </script>
